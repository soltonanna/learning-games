<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag Detective · Play &amp; Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../shared/game.css">
</head>
<body>
  <div id="game"></div>

  <script src="../../js/games-data.js"></script>
  <script src="../shared/engine.js"></script>
  <script>
    var FLAGS = [
      ["🇦🇲", "Armenia"], ["🇫🇷", "France"], ["🇯🇵", "Japan"], ["🇧🇷", "Brazil"], ["🇨🇦", "Canada"],
      ["🇮🇹", "Italy"], ["🇩🇪", "Germany"], ["🇺🇸", "United States"], ["🇬🇧", "United Kingdom"], ["🇪🇸", "Spain"],
      ["🇨🇳", "China"], ["🇮🇳", "India"], ["🇦🇺", "Australia"], ["🇲🇽", "Mexico"], ["🇬🇪", "Georgia"],
      ["🇬🇷", "Greece"], ["🇰🇷", "South Korea"], ["🇸🇪", "Sweden"], ["🇪🇬", "Egypt"], ["🇦🇷", "Argentina"],
      ["🇨🇭", "Switzerland"], ["🇳🇱", "Netherlands"], ["🇵🇹", "Portugal"], ["🇳🇴", "Norway"], ["🇰🇪", "Kenya"],
      ["🇫🇮", "Finland"], ["🇿🇦", "South Africa"], ["🇺🇦", "Ukraine"]
    ];
    var NAMES = FLAGS.map(function (f) { return f[1]; });

    GameKit.start({
      id: "flag-detective",
      rounds: 10,
      makeQuestion: function () {
        var f = GameKit.pick(FLAGS);
        return {
          key: f[1],
          prompt: "Which country has this flag?",
          visual: '<div class="v-emoji">' + f[0] + "</div>",
          choices: GameKit.withDistractors(f[1], NAMES, 4),
          answer: f[1]
        };
      }
    });
  </script>
</body>
</html>
