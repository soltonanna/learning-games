<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag Detective · Play &amp; Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Noto+Sans+Armenian:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/game.css">
</head>
<body>
  <div id="game"></div>

  <script src="../../js/settings.js"></script>
  <script src="../../js/games-data.js"></script>
  <script src="../shared/engine.js"></script>
  <script src="../shared/countries.js"></script>
  <script>
    // Countries and levels live in ../shared/countries.js (Easy 30 · Medium 41 · Hard 47).
    GameKit.start({
      id: "flag-detective",
      rounds: 10,
      levels: true,
      makeQuestion: function (lang, level) {
        var c = GameKit.pick(CountryKit.forLevel(level));
        var nameOf = function (x) { return GameKit.tr(x.name); };
        var wrong = CountryKit.distractors(c, CountryKit.upToLevel(level), CountryKit.choiceCount(level) - 1, level, nameOf);
        var name = nameOf(c);
        return {
          key: c.name.en,
          prompt: GameKit.tr({
            en: "Which country has this flag?",
            hy: "Ո՞ր երկրի դրոշն է սա",
            ru: "Какой стране принадлежит этот флаг?"
          }),
          visual: '<div class="v-emoji">' + c.flag + "</div>",
          choices: GameKit.shuffle([name].concat(wrong.map(nameOf))),
          answer: name
        };
      }
    });
  </script>
</body>
</html>
