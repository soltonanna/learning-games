<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capital Cities · Play &amp; Learn</title>
  <link rel="icon" href="../../favicon.ico" sizes="32x32">
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Noto+Sans+Armenian:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/game.css">
</head>
<body>
  <div id="game"></div>

  <script src="../../js/settings.js"></script>
  <script src="../../js/games-data.js"></script>
  <script src="../shared/engine.js"></script>
  <script src="../shared/countries.js"></script>
  <script>
    // Countries and levels live in ../shared/countries.js. Countries whose capital
    // has the same name (Singapore, Kuwait…) are skipped here.
    function withCapital(list) { return list.filter(function (c) { return c.capital; }); }

    GameKit.start({
      id: "capital-cities",
      rounds: 10,
      levels: true,
      makeQuestion: function (lang, level) {
        var c = GameKit.pick(withCapital(CountryKit.forLevel(level)));
        var cityOf = function (x) { return x.capital ? GameKit.tr(x.capital) : null; };
        var wrong = CountryKit.distractors(c, withCapital(CountryKit.upToLevel(level)), CountryKit.choiceCount(level) - 1, level, cityOf);
        var country = GameKit.tr(c.name);
        var city = cityOf(c);
        var enName = (c.name.the ? "the " : "") + c.name.en;
        return {
          key: c.name.en,
          prompt: GameKit.tr({
            en: "What is the capital of " + enName + "?",
            hy: "Ո՞րն է այս երկրի մայրաքաղաքը",
            ru: "Какая столица у этой страны?"
          }),
          visual: '<div><div class="v-emoji">' + c.flag + '</div><div class="v-caption">' + country + "</div></div>",
          choices: GameKit.shuffle([city].concat(wrong.map(cityOf))),
          answer: city,
          explain: GameKit.tr({
            en: city + " is the capital of " + enName + ".",
            hy: country + "՝ մայրաքաղաքը " + city + "։",
            ru: country + ", столица — " + city + "."
          })
        };
      }
    });
  </script>
</body>
</html>
