<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count the Fruits · Play &amp; Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../shared/game.css">
</head>
<body>
  <div id="game"></div>

  <script src="../../js/games-data.js"></script>
  <script src="../shared/engine.js"></script>
  <script>
    var FRUITS = [
      ["🍎", "apple", "apples"], ["🍌", "banana", "bananas"], ["🍓", "strawberry", "strawberries"],
      ["🍊", "orange", "oranges"], ["🍐", "pear", "pears"], ["🍋", "lemon", "lemons"],
      ["🍑", "peach", "peaches"], ["🥝", "kiwi", "kiwis"], ["🍉", "watermelon", "watermelons"]
    ];

    GameKit.start({
      id: "count-fruits",
      rounds: 10,
      makeQuestion: function () {
        var n = GameKit.randInt(1, 10);
        var fruit = GameKit.pick(FRUITS);
        var name = n === 1 ? fruit[1] : fruit[2];
        return {
          key: fruit[0] + n,
          prompt: "How many " + fruit[2] + "?",
          visual: '<div class="v-grid">' + new Array(n + 1).join("<span>" + fruit[0] + "</span>") + "</div>",
          choices: GameKit.numberChoices(n, 1, 10, 4),
          answer: n,
          explain: n + " " + name + "!",
          size: "big"
        };
      }
    });
  </script>
</body>
</html>
