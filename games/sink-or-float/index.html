<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sink or Float? · Play &amp; Learn</title>
  <link rel="icon" href="../../favicon.ico" sizes="32x32">
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Noto+Sans+Armenian:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/game.css">
  <style>
    .tank { position: relative; width: 100%; max-width: 360px; }
    .tank .v-emoji { position: relative; z-index: 1; margin-bottom: -18px; }
    .water { height: 60px; border-radius: 0 0 22px 22px; background: linear-gradient(#7DD3FC, #38BDF8); box-shadow: inset 0 6px 0 rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="../../js/settings.js"></script>
  <script src="../../js/games-data.js"></script>
  <script src="../shared/engine.js"></script>
  <script>
    var FLOATS = { en: "🛟 Floats", hy: "🛟 Կլողա",  ru: "🛟 Плавает" };
    var SINKS  = { en: "⬇️ Sinks",  hy: "⬇️ Կսուզվի", ru: "⬇️ Тонет" };
    // [emoji, floats?, name]. Armenian names include the article (-ը / -ն).
    var THINGS = [
      ["🪨", false, { en: "rock", hy: "քարը", ru: "камень" }],
      ["🪶", true,  { en: "feather", hy: "փետուրը", ru: "перо" }],
      ["🪙", false, { en: "coin", hy: "մետաղադրամը", ru: "монета" }],
      ["🦆", true,  { en: "rubber duck", hy: "ռետինե բադիկը", ru: "резиновая уточка" }],
      ["🍎", true,  { en: "apple", hy: "խնձորը", ru: "яблоко" }],
      ["🔑", false, { en: "key", hy: "բանալին", ru: "ключ" }],
      ["🍃", true,  { en: "leaf", hy: "տերևը", ru: "листик" }],
      ["🏐", true,  { en: "beach ball", hy: "գնդակը", ru: "пляжный мяч" }],
      ["🥄", false, { en: "spoon", hy: "գդալը", ru: "ложка" }],
      ["⛵", true,  { en: "boat", hy: "նավակը", ru: "кораблик" }],
      ["⚓", false, { en: "anchor", hy: "խարիսխը", ru: "якорь" }],
      ["🪵", true,  { en: "log", hy: "գերանը", ru: "бревно" }],
      ["🧊", true,  { en: "ice cube", hy: "սառույցի կտորը", ru: "кубик льда" }],
      ["🔩", false, { en: "bolt", hy: "պտուտակը", ru: "болт" }],
      ["🧽", true,  { en: "sponge", hy: "սպունգը", ru: "губка" }],
      ["💍", false, { en: "ring", hy: "մատանին", ru: "колечко" }]
    ];

    function cap(s) { return s.charAt(0).toLocaleUpperCase() + s.slice(1); }

    GameKit.start({
      id: "sink-or-float",
      rounds: 10,
      makeQuestion: function (lang) {
        var t = GameKit.pick(THINGS);
        var floats = t[1];
        var n = t[2];
        return {
          key: n.en,
          prompt: GameKit.tr({
            en: "Does the " + n.en + " sink or float?",
            hy: cap(n.hy) + " կսուզվի՞, թե՞ կլողա",
            ru: cap(n.ru) + " тонет или плавает?"
          }),
          visual: '<div class="tank"><div class="v-emoji">' + t[0] + '</div><div class="water"></div></div>',
          choices: [GameKit.tr(FLOATS), GameKit.tr(SINKS)],
          answer: GameKit.tr(floats ? FLOATS : SINKS),
          explain: GameKit.tr({
            en: "The " + n.en + (floats ? " floats!" : " sinks!"),
            hy: cap(n.hy) + (floats ? " կլողա։" : " կսուզվի։"),
            ru: cap(n.ru) + (floats ? " плавает!" : " тонет!")
          })
        };
      }
    });
  </script>
</body>
</html>
