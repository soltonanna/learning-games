<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missing Operators · Play &amp; Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Noto+Sans+Armenian:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/game.css">
  <style>
    .eq {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 10px; font-family: var(--font-display); font-weight: 800;
      font-size: clamp(34px, 9vw, 60px); color: var(--ink); line-height: 1;
    }
    .eq__num { min-width: 1ch; text-align: center; }
    .eq__op { color: var(--ink-soft); }
    .eq__gap {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.25em; height: 1.25em; border-radius: 18px;
      border: 4px dashed var(--c); background: var(--soft); color: var(--c);
      animation: eq-pulse 1.6s ease-in-out infinite;
    }
    @keyframes eq-pulse { 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .eq__gap { animation: none; } }
    .eq-hint { margin-top: 14px; text-align: center; font-weight: 700; color: var(--ink-soft); font-size: 15px; }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="../../js/settings.js"></script>
  <script src="../../js/games-data.js"></script>
  <script src="../shared/engine.js"></script>
  <script>
    /*
     * MISSING OPERATORS — one sign is missing from the equation: pick +, −, × or ÷.
     *
     *   Easy:   a ? b = c        + and − up to 20, × and ÷ up to 5 × 5
     *   Medium: a ? b = c        + and − up to 100, × and ÷ up to 10 × 10
     *   Hard:   a ? b ○ c = d    three numbers, one sign given — × and ÷ go first!
     *
     * Every question has exactly ONE right sign (e.g. "2 ? 2 = 4" is never asked,
     * because both + and × work). Division always comes out even.
     */
    var OPS = ["+", "−", "×", "÷"];

    var NAMES = {
      "+": { en: "plus",       hy: "գումարած",    ru: "плюс" },
      "−": { en: "minus",      hy: "հանած",       ru: "минус" },
      "×": { en: "times",      hy: "բազմապատկած", ru: "умножить на" },
      "÷": { en: "divided by", hy: "բաժանած",     ru: "разделить на" }
    };

    function apply(a, op, b) {
      if (op === "+") return a + b;
      if (op === "−") return a - b;
      if (op === "×") return a * b;
      return a / b;
    }

    /** Value of nums/ops with the real order of operations (× ÷ first, then + − left to right).
     *  strict = true → returns null if any step is negative or a division isn't even. */
    function evaluate(nums, ops, strict) {
      var n = nums.slice(), o = ops.slice();
      for (var pass = 0; pass < 2; pass++) {
        var i = 0;
        while (i < o.length) {
          var first = o[i] === "×" || o[i] === "÷";
          if (pass === 0 ? first : true) {
            if (o[i] === "÷" && (n[i + 1] === 0 || (strict && n[i] % n[i + 1] !== 0))) return null;
            var v = apply(n[i], o[i], n[i + 1]);
            if (strict && v < 0) return null;
            n.splice(i, 2, v); o.splice(i, 1);
          } else i++;
        }
      }
      return n[0];
    }

    /** True if only `answer` (at slot `gap`) makes the equation correct. */
    function onlyOne(nums, ops, gap, answer, result) {
      return OPS.every(function (op) {
        var test = ops.slice(); test[gap] = op;
        var v = evaluate(nums, test, false);
        var ok = v !== null && Math.abs(v - result) < 1e-9;
        return op === answer ? ok : !ok;
      });
    }

    function r(min, max) { return GameKit.randInt(min, max); }

    /** a ? b = c */
    function twoNumbers(level) {
      var big = level === "medium";
      for (var t = 0; t < 300; t++) {
        var op = GameKit.pick(OPS), a, b;
        if (op === "+") { a = r(1, big ? 60 : 12); b = r(1, big ? 40 : 9); }
        else if (op === "−") { a = r(big ? 20 : 5, big ? 100 : 20); b = r(1, a - 1); }
        else if (op === "×") { a = r(2, big ? 10 : 5); b = r(2, big ? 10 : 5); }
        else { b = r(2, big ? 10 : 5); a = b * r(2, big ? 10 : 5); }
        var c = apply(a, op, b);
        if (onlyOne([a, b], [op], 0, op, c)) return { nums: [a, b], ops: [op], gap: 0, result: c };
      }
    }

    /** a ? b ○ c = d — one sign given, one missing */
    function threeNumbers() {
      for (var t = 0; t < 500; t++) {
        var ops = [GameKit.pick(OPS), GameKit.pick(OPS)];
        var nums = [r(1, 12), r(1, 10), r(1, 10)];
        // Make divisions come out even: the number before ÷ is a multiple of the one after.
        if (ops[0] === "÷") nums[0] = nums[1] * r(1, 6);
        if (ops[1] === "÷") {
          if (ops[0] === "×" || ops[0] === "÷") nums[2] = GameKit.pick([1, 2, 3, 4, 5].filter(function (d) {
            var left = evaluate([nums[0], nums[1]], [ops[0]], true); return left !== null && left % d === 0;
          }) || [1]);
          else nums[1] = nums[2] * r(1, 6);
        }
        if (nums.indexOf(0) > -1 || nums.some(function (x) { return x > 60; })) continue;
        var d = evaluate(nums, ops, true);
        if (d === null || d > 100) continue;
        var gap = r(0, 1);
        if (onlyOne(nums, ops, gap, ops[gap], d)) return { nums: nums, ops: ops, gap: gap, result: d };
      }
    }

    function equationHTML(q) {
      var html = '<span class="eq__num">' + q.nums[0] + "</span>";
      q.ops.forEach(function (op, i) {
        html += i === q.gap
          ? '<span class="eq__gap" aria-label="?">?</span>'
          : '<span class="eq__op">' + op + "</span>";
        html += '<span class="eq__num">' + q.nums[i + 1] + "</span>";
      });
      return html + '<span class="eq__op">=</span><span class="eq__num">' + q.result + "</span>";
    }

    function equationText(q, fill) {
      var s = String(q.nums[0]);
      q.ops.forEach(function (op, i) { s += " " + (i === q.gap ? fill : op) + " " + q.nums[i + 1]; });
      return s + " = " + q.result;
    }

    function equationSpoken(q, lang) {
      var gapWord = { en: "what sign", hy: "ո՞ր նշանը", ru: "какой знак" }[lang];
      var eq = { en: "equals", hy: "հավասար է", ru: "равно" }[lang];
      var s = String(q.nums[0]);
      q.ops.forEach(function (op, i) { s += ", " + (i === q.gap ? gapWord : NAMES[op][lang]) + ", " + q.nums[i + 1]; });
      return s + ", " + eq + " " + q.result;
    }

    GameKit.start({
      id: "missing-operators",
      rounds: 10,
      levels: true,
      makeQuestion: function (lang, level) {
        var q = level === "hard" ? threeNumbers() : twoNumbers(level);
        var answer = q.ops[q.gap];
        var mixed = q.ops.length > 1 &&
          q.ops.some(function (o) { return o === "×" || o === "÷"; }) &&
          q.ops.some(function (o) { return o === "+" || o === "−"; });

        return {
          key: equationText(q, "?"),
          prompt: GameKit.tr({
            en: "Which sign is missing?",
            hy: "Ո՞ր նշանն է պակասում",
            ru: "Какой знак пропущен?"
          }),
          say: GameKit.tr({
            en: "Which sign is missing? ",
            hy: "Ո՞ր նշանն է պակասում։ ",
            ru: "Какой знак пропущен? "
          }) + equationSpoken(q, lang),
          visual:
            '<div><div class="eq">' + equationHTML(q) + "</div>" +
            (mixed ? '<p class="eq-hint">💡 ' + GameKit.tr({
              en: "Remember: × and ÷ come first!",
              hy: "Հիշի՛ր․ × և ÷ գործողությունները կատարվում են առաջինը։",
              ru: "Помни: × и ÷ выполняются первыми!"
            }) + "</p>" : "") + "</div>",
          choices: OPS.slice(),        // always in the same order: + − × ÷
          answer: answer,
          explain: equationText(q, answer),
          size: "big"
        };
      }
    });
  </script>
</body>
</html>
