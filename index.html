<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play &amp; Learn</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Noto+Sans+Armenian:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
  <header class="hero">
    <div class="wrap hero__inner">
      <div class="hero__top">
        <a class="brand" href="index.html">
          <span class="brand__mark" aria-hidden="true">🦉</span>
          <span class="brand__name">Play &amp; Learn</span>
        </a>
        <div class="lang" id="lang" role="group" aria-label="Language"></div>
      </div>
      <h1 class="hero__title" id="hero-title">What shall we learn today?</h1>
      <p class="hero__sub" id="hero-sub">Pick a game, tap it, and start playing!</p>
    </div>
  </header>

  <main class="wrap">
    <nav class="filters" id="filters" aria-label="Choose a theme"></nav>

    <div class="settings">
      <div class="setting" id="ages"></div>
      <div class="setting" id="timer"></div>
    </div>

    <div id="sections">
      <noscript><p class="empty">Please turn on JavaScript to see the games.</p></noscript>
    </div>
  </main>

  <footer class="wrap footer" id="footer">Made with care for curious little minds.</footer>

  <!-- Settings and data first, then the UI that renders them -->
  <script src="js/settings.js"></script>
  <script src="js/games-data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
