services:
  web:
    build: .
    image: play-and-learn:latest
    container_name: play-and-learn
    ports:
      - "8080:80"
    restart: unless-stopped

  # Development: edit files and just refresh the browser (no rebuild).
  # Run with:  docker compose --profile dev up dev
  dev:
    image: nginx:1.27-alpine
    profiles: ["dev"]
    ports:
      - "8081:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
